version: 1
name: admin-product-design
language: zh-CN
load_policy:
  entrypoint: references/index.md
  default: selective
  precedence:
    - explicit_user_or_business_requirement
    - prd_specific_constraints
    - this_reference_set
    - generic_ui_heuristics
rule_markers:
  MUST: comply or document deviation
  DEFAULT: apply unless overridden
  PENDING: draft value; confirm when material
references:
  - id: list-query
    file: references/01-list-query.md
    triggers: [列表, 表格, 排序, 分页, 搜索, 筛选, 下钻]
    related: [feedback-states, permissions, export]
  - id: forms-validation
    file: references/02-forms-validation.md
    triggers: [表单, 字段, 校验, 提交, 草稿]
    related: [feedback-states, permissions]
  - id: feedback-states
    file: references/03-feedback-states.md
    triggers: [空状态, 加载, 错误, 成功反馈, 确认框]
    related: [list-query, status-actions-batch]
  - id: status-actions-batch
    file: references/04-status-actions-batch.md
    triggers: [状态机, 状态流转, 操作按钮, 批量操作, 导入, 结果页]
    related: [feedback-states, permissions, notifications, export]
  - id: permissions
    file: references/05-permissions.md
    triggers: [权限, 角色, 权限矩阵, 数据范围, 越权]
    related: [status-actions-batch, export]
  - id: display-and-media
    file: references/06-display-and-media.md
    triggers: [日期, 金额, 数字, 单位, 图片, 视频, 上传]
    related: [feedback-states]
  - id: notifications
    file: references/07-notifications.md
    triggers: [站内信, 短信, 邮件, 推送, 通知, 频控]
    related: [status-actions-batch]
  - id: export
    file: references/08-export.md
    triggers: [导出, 下载, 异步任务, 敏感字段]
    related: [permissions, notifications]
  - id: admin-menu
    file: references/09-admin-menu.md
    triggers: [后台菜单, 导航, 分类, 资源码]
    related: [permissions]
  - id: weighted-sorting
    file: references/10-weighted-sorting.md
    triggers: [多因子, 排序模型, 权重, 评分, 运营排序]
    related: [list-query]